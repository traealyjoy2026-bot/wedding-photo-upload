<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f2">
  <title>Trae & Aly Wedding Photos</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f8f6f2;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .bar {
      flex: 0 0 auto;
      text-align: center;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      font-size: 13px;
      color: #555;
      background: #f8f6f2;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    iframe {
      display: block;
      border: 0;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">Trae &amp; Aly • October 1, 2026</div>
    <iframe
      src="https://script.google.com/macros/s/AKfycby0AFyXjCqGmSExPw1zDgg-n4nRDAGQ7COrcPn2l_QUnvZfOTOnkNkwRh4oK6Bfof2lGw/exec"
      title="Upload wedding photos"
      credentialless
      referrerpolicy="no-referrer"
      allow="camera; microphone"
    ></iframe>
  </div>
</body>
</html>
