<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#1c1a18">
  <title>Media Upload</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #302c28 url("./background.jpg") center center / cover no-repeat;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(18,16,15,.40);
      pointer-events: none;
    }

    iframe {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: transparent;
    }
  </style>
</head>

<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbyVUhk_mQ2L7npE1m2r303G0ZmtAGWHaMS_zW2hyFryVDrH6_I2jQ55-DcKU0g9-cidZw/exec"
    title="Media Upload"
    referrerpolicy="no-referrer"
    allow="camera">
  </iframe>
</body>
</html>
